name: Deploy tested portfolio v0.8.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v081.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public deployment repository
        uses: actions/checkout@v4

      - name: Download exact tested production artifact
        env:
          ARTIFACT_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-f580-820a-a0e8-4bb5588feef9/raw?se=2026-10-11T07%3A43%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=495d613f-4c0b-50af-8750-1fb21ffab4b6&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T01%3A46%3A30Z&ske=2026-10-12T01%3A46%3A30Z&sks=b&skv=2026-02-06&sig=cr2f0wkSuLLUMrnyjVdShAUtkYFAxJsk92fmpp5ILuI%3D"
        run: |
          set -euo pipefail
          curl -LfsS --retry 3 "$ARTIFACT_URL" -o /tmp/portfolio-v081.zip
          echo "36c6a2dfcf1fdada66cc8dbb8cc2b81b3d3ab181811a8a699b28228392d40f92  /tmp/portfolio-v081.zip" | sha256sum -c -

      - name: Verify and replace public site
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-site /tmp/deploy-workflow
          unzip -q /tmp/portfolio-v081.zip -d /tmp/portfolio-site
          test -f /tmp/portfolio-site/index.html
          test -d /tmp/portfolio-site/assets
          if [ -d /tmp/portfolio-site/src ] || [ -d /tmp/portfolio-site/scripts ]; then
            echo "Refusing deployment: unexpected source directories in production artifact"
            exit 1
          fi
          cp .github/workflows/deploy-v081.yml /tmp/deploy-workflow/deploy-v081.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/portfolio-site/. .
          touch .nojekyll
          mkdir -p .github/workflows
          cp /tmp/deploy-workflow/deploy-v081.yml .github/workflows/deploy-v081.yml

      - name: Commit exact tested site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "deploy: portfolio v0.8.1"
          git push origin HEAD:main
