name: One-time YAKUZA capitalization deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-yakuza-cap.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-1554-8209-a33f-e044e24130b0/raw?se=2026-10-06T15%3A35%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=fe8bc19e-0313-5e88-ab7b-42c391746663&skoid=8cb40e9f-389f-4cf6-afaa-e5bd4c7fd98c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T01%3A56%3A55Z&ske=2026-10-07T01%3A56%3A55Z&sks=b&skv=2026-02-06&sig=uK5XZCLDghJupHi5fUk3MuZDVq5JzT0xxCfokXa7Mlc%3D"
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Download tested production artifact
        run: curl -LfsS "$ARTIFACT_URL" -o /tmp/portfolio.zip

      - name: Replace public production files
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -q /tmp/portfolio.zip -d .
          touch .nojekyll

      - name: Commit production build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: standardize YAKUZA ESPORTS capitalization"
          git push
