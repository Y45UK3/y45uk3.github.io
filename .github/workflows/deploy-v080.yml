name: Deploy portfolio v0.8.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v080.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public deployment repository
        uses: actions/checkout@v4

      - name: Download tested production artifact
        env:
          ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-82a0-81fa-9306-e0fc64c91672/raw?se=2026-10-07T19%3A20%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=49448e87-0dfe-58af-b52b-a27ed55cae49&skoid=8cb40e9f-389f-4cf6-afaa-e5bd4c7fd98c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T00%3A56%3A53Z&ske=2026-10-08T00%3A56%3A53Z&sks=b&skv=2026-02-06&sig=/2mhXCIuplLqphspArr7EMwi7%2BRjo8qLipn4qsMgooU%3D"
        run: |
          set -euo pipefail
          curl -LfsS --retry 3 "$ARTIFACT_URL" -o /tmp/portfolio-v080.zip
          echo "74fa7237cb236cdbf02947c3d0eb2e13fb3d265190945f509f07fe9a88f1c1df  /tmp/portfolio-v080.zip" | sha256sum -c -

      - name: Replace public site with tested artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/site /tmp/workflow
          unzip -q /tmp/portfolio-v080.zip -d /tmp/site
          cp .github/workflows/deploy-v080.yml /tmp/workflow/deploy-v080.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          touch .nojekyll
          mkdir -p .github/workflows
          cp /tmp/workflow/deploy-v080.yml .github/workflows/deploy-v080.yml

      - name: Commit exact tested site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "deploy: portfolio v0.8.0"
          git push origin HEAD:main
