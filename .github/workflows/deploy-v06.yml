name: One-time portfolio v0.6 deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-v06.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5bd0-8211-b8b3-2fedb2503719/raw?se=2026-10-06T14%3A43%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=33a0a187-048f-524f-b912-7bf3c5e54770&skoid=8cb40e9f-389f-4cf6-afaa-e5bd4c7fd98c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T02%3A06%3A27Z&ske=2026-10-07T02%3A06%3A27Z&sks=b&skv=2026-02-06&sig=MTF77TjB/iOJ5A4h/7cUg8lUd5KUE4EcIXiRrVeTsBc%3D"
    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Download tested production artifact
        run: curl -LfsS "$ARTIFACT_URL" -o /tmp/portfolio-v06.zip

      - name: Replace public files with v0.6 build
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -q /tmp/portfolio-v06.zip -d .
          touch .nojekyll

      - name: Commit production build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: publish portfolio v0.6.0"
          git push
